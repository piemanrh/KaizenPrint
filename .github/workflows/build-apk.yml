name: Build Kaizen Print APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Download PAX NeptuneLite API
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3             https://raw.githubusercontent.com/Fuelin-net/pax_sdk/main/android/libs/neptune-lite-api-v3.26.00-20210903.jar             -o app/libs/neptune-lite-api.jar
          ls -lh app/libs/neptune-lite-api.jar

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk print.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaizenPrint-APK
          path: print.apk
